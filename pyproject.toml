[project]
name = "querybot"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "openai (>=2.38.0,<3.0.0)",
    "sqlglot (>=30.8.0,<31.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "gradio (>=6.15.0,<7.0.0)",
    "groq (>=1.2.0,<2.0.0)"
